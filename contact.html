<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Anu Raj through the accessible portfolio contact form.">

    <meta name="author" content="Anu Raj">

    <meta name="robots" content="index, follow">

    <title>Contact | Anu Raj</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <header>

        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

    </header>

    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <h2 id="contact-heading">Get in Touch</h2>

            <p>
                You can use the form below to send me a message.
            </p>

            <form action="#" method="post">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true">

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true">

                </div>

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true">

                </div>

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"></textarea>

                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Anu Raj. All rights reserved.
        </p>
    </footer>

</body>

</html>
